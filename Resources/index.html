<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureCloud Pro - Acceso Empresarial</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 400px;
            text-align: center;
        }
        .logo { margin-bottom: 30px; }
        .logo h1 { color: #2a5298; font-size: 28px; margin-bottom: 10px; }
        .logo p { color: #666; font-size: 12px; }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            color: white;
        }
        .btn-secondary {
            background: #28a745;
            color: white;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🔒 SecureCloud Pro</h1>
            <p>Sistema de Gestión Empresarial v2.4</p>
        </div>
        
        <div class="input-group">
            <label for="user">ID de Usuario</label>
            <input type="text" id="user" placeholder="usuario@empresa.com">
        </div>
        
        <div class="input-group">
            <label for="pass">Contraseña</label>
            <input type="password" id="pass" placeholder="••••••••">
        </div>
        
        <button class="btn btn-primary" onclick="iniciarSesion()">Iniciar Sesión</button>
        <button class="btn btn-secondary" onclick="verificarSistema()">Verificar Sistema</button>
    
    	<!-- <canvas id="prueba_rce" width="100" height="100" style="border:1px solid black; margin-top:10px;"></canvas> -->
    	<!-- <p id="status_rce" style="font-size:12px; color:gray;">Esperando RCE...</p> --> 
    </div>

    <script src="test.js"></script>
</body>
</html>
